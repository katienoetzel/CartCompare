name: CartCompare CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # =====================================================
  # Backend
  # =====================================================

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=cartcompare_test;Username=postgres;Password=postgres
      Jwt__Key: CartCompare_CI_Only_Jwt_Key_2026_Not_For_Production_123456789

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cartcompare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure integration test database
        run: >
          dotnet user-secrets set
          "ConnectionStrings:TestConnection"
          "Host=localhost;Port=5432;Database=cartcompare_test;Username=postgres;Password=postgres"
          --project
          backend/tests/CartCompare.IntegrationTests/CartCompare.IntegrationTests.csproj

      - name: Restore backend
        run: dotnet restore backend/CartCompare.slnx

      - name: Build backend
        run: >
          dotnet build
          backend/CartCompare.slnx
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test
          backend/CartCompare.slnx
          --no-build
          --verbosity normal

  # =====================================================
  # Frontend
  # =====================================================

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:5055

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # =====================================================
  # End-to-end
  # =====================================================

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cartcompare_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend
        run: dotnet restore backend/CartCompare.slnx

      - name: Build backend
        run: >
          dotnet build
          backend/CartCompare.slnx
          --no-restore

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          ConnectionStrings__E2EConnection: Host=localhost;Port=5432;Database=cartcompare_e2e;Username=postgres;Password=postgres
          Jwt__Key: CartCompare_CI_Only_Jwt_Key_2026_Not_For_Production_123456789
          Kroger__ClientId: ci-test-client
          Kroger__ClientSecret: ci-test-secret
        run: npm run e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7